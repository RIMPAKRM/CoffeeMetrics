# Render Blueprint — deploys web + api as ONE free web service.
# Dashboard: https://dashboard.render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: coffeemetrics
    runtime: node
    plan: free
    buildCommand: npm i -g pnpm@10.18.3 && pnpm install --frozen-lockfile && pnpm -r build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
